[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && cd apps/api && pnpm exec prisma generate && pnpm run build && cd ../web && pnpm run build && cd ../.. && mkdir -p apps/api/public/files && cp -r uploads/. apps/api/public/files/ && cp -r apps/web/dist/. apps/api/public/"

[deploy]
startCommand = "cd apps/api && pnpm exec prisma migrate deploy && pnpm run db:seed && pnpm exec tsx src/server.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
