[build]
builder = "nixpacks"
buildCommand = "cd apps/api && npx prisma generate && cd ../.. && pnpm -r build && mkdir -p apps/api/public && cp -r apps/web/dist/. apps/api/public/"

[deploy]
startCommand = "cd apps/api && sh start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
