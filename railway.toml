[build]
builder = "nixpacks"
buildCommand = "bash scripts/build.sh"

[deploy]
startCommand = "cd apps/api && pnpm exec prisma migrate deploy && (pnpm run db:seed || echo 'seed skipped') && pnpm exec tsx src/server.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
